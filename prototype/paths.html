<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your top 3 paths</title>
<link rel="stylesheet" href="styles.css">
<style>
.pcard { flex: 1 1 340px; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; transition: border-color .2s, transform .2s; }
.pcard:hover { border-color: #4A5244; transform: translateY(-2px); }
.pcard .head { padding: 26px 26px 20px; display: flex; flex-direction: column; gap: 8px; }
.pcard .rank { align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-tint); border: 1px solid var(--accent-line); padding: 3px 10px; border-radius: 999px; }
.pcard h2 { font: 700 30px/1.1 var(--display); margin: 4px 0 0; }
.pcard .one { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.pcard .proof { margin: 0 14px; padding: 18px; border-radius: 16px; background: linear-gradient(180deg, #1A2214, #151A12); border: 1px solid var(--accent-line); display: flex; flex-direction: column; gap: 6px; }
.pcard .proof b { font: 700 22px/1.2 var(--display); color: var(--accent-hover); }
.pcard .proof span { font-size: 14px; color: var(--muted); line-height: 1.45; }
.pcard .sec { padding: 18px 26px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); }
.pcard .big2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pcard .big2 b { display: block; font: 700 28px var(--display); }
.pcard .big2 span { font-size: 13px; color: var(--muted); }
.pcard .foot { margin-top: auto; padding: 20px 26px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; border-top: 1px solid var(--line); }
.pcard .foot .cta { width: 100%; }
.textlink { font: 500 14px var(--body); color: var(--text-soft); background: none; border: none; padding: 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: #4A5244; min-height: 36px; }
.textlink:hover { color: var(--accent); text-decoration-color: var(--accent); }
.more-stack { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0 8px; text-align: center; }
.more-stack p { margin: 0; font-size: 15px; color: var(--muted); }
.scrim { align-items: center; justify-content: center; padding: 24px; }
.modal { width: 680px; max-width: 100%; max-height: calc(100vh - 48px); overflow-y: auto; background: var(--panel); border: 1px solid #2A2F27; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 26px; animation: modalIn .25s ease-out both; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.modal .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
@media (max-width: 720px) { .modal .grid { grid-template-columns: minmax(0, 1fr); } }
</style>
<script src="app.js"></script>
</head>
<body>
<header id="top" data-step="3"></header>

<main class="wrap" style="max-width: 1280px; flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 32px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 class="h1">Three paths that fit you</h1>
    <p class="lead" style="max-width: 680px">Picked from how you reacted to real tasks, and ordered by real demand where you want to work. No scores.</p>
  </div>
  <div class="cards" id="cards"></div>
  <div class="more-stack">
    <p>Not feeling any of these?</p>
    <a class="alt" href="index.html?more">Show me 4 more tasks</a>
  </div>
</main>

<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
      <div>
        <div class="lbl">What this job is like</div>
        <h2 id="dTitle" style="margin-top: 6px; font: 700 34px/1.1 var(--display)"></h2>
      </div>
      <button class="close" type="button" id="close" aria-label="Close"></button>
    </div>
    <p id="dWhat" style="margin: 0; font-size: 18px; line-height: 1.55; color: var(--text-soft)"></p>
    <div class="grid">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span class="lbl">A typical day</span>
        <div id="dDay" style="display: flex; flex-direction: column; gap: 12px"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span class="lbl">Where it can take you</span>
        <div class="ladder" id="dLadder"></div>
        <div style="font-size: 13px; color: var(--faint)">Salary ranges fill in from scraped job ads.</div>
      </div>
    </div>
    <a class="cta" href="roadmap.html">Choose this path</a>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const PATHS = [
  { key: 'backend', rank: 'Most open roles', title: 'Backend developer', roles: '143', time: '~7 mo',
    oneLine: 'Builds the parts of an app nobody sees: the logic, the data, the plumbing.',
    proof: 'You liked 4 of 5 coding tasks', reason: 'And you said you love figuring out why something broke.',
    head: ['Python (school)', 'Basic HTML'], cos: 'RPKM',
    what: 'You build the engine behind apps and websites. When someone taps “Pay”, your code checks the card, saves the order and tells the warehouse. Most of the job is solving small puzzles and making sure things do not break.',
    day: [['09:30', 'Quick team stand up'], ['10:00', 'Fix a bug a customer reported yesterday'], ['13:00', 'Build a small new feature with a senior dev'], ['16:00', 'Review a teammate’s code']],
    ladder: [['Junior backend developer', '0 to 2 years'], ['Backend developer', '2 to 5 years'], ['Senior backend developer', '5+ years'], ['Tech lead / Head of engineering', '8+ years']] },
  { key: 'data', rank: 'Fastest to start', title: 'Data analyst', roles: '86', time: '~5 mo',
    oneLine: 'Turns messy numbers into answers a business can act on.',
    proof: 'You liked 3 of 4 data tasks', reason: 'And you said you like working with information and numbers.',
    head: ['Excel', 'Python (school)'], cos: 'SAOD',
    what: 'You help a company understand what is happening. You pull data, clean it up, find the pattern and explain it in a chart someone in a meeting can understand.',
    day: [['09:30', 'Check this morning’s sales dashboard'], ['10:30', 'Answer a question from marketing with SQL'], ['14:00', 'Clean up a messy spreadsheet'], ['16:00', 'Present one chart and what it means']],
    ladder: [['Junior data analyst', '0 to 2 years'], ['Data analyst', '2 to 4 years'], ['Senior analyst', '4+ years'], ['Head of data / Analytics lead', '8+ years']] },
  { key: 'qa', rank: 'Least competition', title: 'QA engineer', roles: '52', time: '~4 mo',
    oneLine: 'Finds what is broken before customers do.',
    proof: 'You liked 2 of 3 testing tasks', reason: 'A great way into tech without years of coding first.',
    head: ['Customer service', 'Basic HTML'], cos: 'LTNB',
    what: 'You try to break the product on purpose, so customers never see the bugs. You write down exactly how to reproduce a problem and, over time, write code that tests things automatically.',
    day: [['09:30', 'Stand up with the developers'], ['10:00', 'Test a new feature on phone and desktop'], ['13:30', 'Write clear bug reports'], ['15:30', 'Automate one test to run every night']],
    ladder: [['Junior QA tester', '0 to 2 years'], ['QA engineer', '2 to 4 years'], ['Senior QA / Automation engineer', '4+ years'], ['QA lead / Head of quality', '7+ years']] }
];
// Use the real interview evidence where the path matches.
try {
  const top = JSON.parse(localStorage.getItem('top3') || '[]');
  PATHS.forEach((p) => { const t = top.find((x) => x.key === p.key); if (t && t.shown) p.proof = 'You liked ' + t.liked + ' of ' + t.shown + ' ' + t.kind + ' tasks'; });
} catch (e) {}

$('cards').innerHTML = PATHS.map((p, i) => `
  <article class="pcard">
    <div class="head">
      <span class="rank">${p.rank}</span>
      <h2>${p.title}</h2>
      <p class="one">${p.oneLine}</p>
    </div>
    <div class="proof"><b>${p.proof}</b><span>${p.reason}</span></div>
    <div class="sec" style="border-top: none; padding-top: 22px">
      <span class="lbl">The market</span>
      <div class="big2">
        <div><b>${p.roles}</b><span>open roles near you</span></div>
        <div><b>${p.time}</b><span>to job ready at 10h a week</span></div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 4px">
        <span style="font-size: 13px; color: var(--faint); margin-right: 4px">Hiring now</span>
        ${p.cos.split('').map((c) => `<span class="logo-ph">${c}</span>`).join('')}
      </div>
    </div>
    <div class="sec">
      <span class="lbl">Your head start</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">${p.head.map((h) => `<span class="chip" style="font-size: 13px; padding: 5px 10px">${h}</span>`).join('')}</div>
    </div>
    <div class="foot">
      <a class="cta" href="roadmap.html">Choose this path</a>
      <button class="textlink" type="button" data-open="${i}">What's this job like?</button>
    </div>
  </article>`).join('');

function open(i) {
  const p = PATHS[i];
  $('dTitle').textContent = p.title;
  $('dWhat').textContent = p.what;
  $('dDay').innerHTML = p.day.map(([t, x]) => `<div class="day"><span>${t}</span><span>${x}</span></div>`).join('');
  $('dLadder').innerHTML = p.ladder.map(([r, y], j) => `
    <div class="rung"><div class="rail"><div class="dot ${j === 0 ? 'on' : ''}"></div><div class="bar"></div></div>
      <div class="body"><div><div style="font-weight: 600; font-size: 15px">${r}</div><div style="font-size: 13px; color: var(--muted)">${y} · [CZK range]</div></div></div></div>`).join('');
  $('scrim').classList.add('open');
  $('close').focus();
}
function close() { $('scrim').classList.remove('open'); }
document.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => open(Number(b.dataset.open)));
$('close').innerHTML = ICON.x;
$('close').onclick = close;
$('scrim').addEventListener('click', (e) => { if (e.target === $('scrim')) close(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
</script>
</body>
</html>
