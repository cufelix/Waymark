<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your roadmap</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<header id="top" data-step="4"></header>

<main class="wrap" style="max-width: 900px; flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 40px">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: var(--muted)">Your roadmap · Prague · built from 214 job ads</span>
      <h1 style="font: 700 44px/1.05 var(--display)">Backend developer</h1>
    </div>
    <a class="ghost" href="paths.html">Change path</a>
  </div>

  <div class="done-row">
    <span id="doneTile"></span>
    <div style="flex: 1; min-width: 200px">
      <div style="font-weight: 600; font-size: 16px; color: var(--muted)">Section 1 · Computer basics</div>
      <div style="font-size: 13px; color: var(--faint)">How the web works · Command line basics</div>
    </div>
    <span class="chip" style="font-size: 13px; padding: 5px 10px">You've got this · from your CV</span>
    <a class="review" href="module.html">Not sure? Review it</a>
  </div>

  <div id="sections" style="display: flex; flex-direction: column; gap: 40px"></div>
</main>

<!-- Useful extras, tucked into the corner -->
<div class="info-dock" id="infoDock" tabindex="0" role="button" aria-expanded="false" aria-label="Progress and legend">
  <div class="id-mini">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>2 of 16 done</span>
  </div>
  <div class="id-body">
    <div>
      <div style="font: 600 15px var(--display)">Your progress</div>
      <div style="font-size: 13px; color: var(--muted); margin-top: 4px">2 of 16 modules · about 7 months at 10h a week</div>
    </div>
    <div class="progress" style="height: 6px"><div style="width: 12%; height: 6px"></div></div>
    <div class="legend" id="legend" style="border-top: none; padding-top: 0"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const SECTIONS = [
  { id: 's2', title: 'Your first language: Python', why: 'Everything after this is written in code. Python first: 41 of 120 junior backend ads in Prague ask for it, and it is the easiest to read.',
    mods: [['Variables and logic', 'Code'], ['Functions', 'Code'], ['Working with files', 'Code'], ['Your first small project', 'Practice project']] },
  { id: 's3', title: 'Data and databases', why: 'Backends store things. Once you can write code, you learn where the data lives.',
    mods: [['SQL basics', 'Data'], ['Designing tables', 'Data'], ['Python talks to a database', 'Code']] },
  { id: 's4', title: 'Building APIs', why: 'This is the actual job: code that apps call to get and save data.',
    mods: [['How HTTP and REST work', 'Theory'], ['Build an API with FastAPI', 'Code'], ['Testing your code', 'Tools']] },
  { id: 's5', title: 'Shipping it', why: 'Employers want to see something live. These skills get your work out of your laptop.',
    mods: [['Git and GitHub', 'Tools'], ['Docker', 'Tools'], ['Deploy your first app', 'Practice project']] }
];

// Smooth route like a transit line: straight runs joined by rounded corners.
// Tiles alternate left and right; labels sit on the outer side, so the line never crosses text.
const W = 760, LX = 180, RX = 460, R = 44;
function routePath(a, b) {
  const ax = a.x + 60, ay = a.y + 50, bx = b.x + 60, by = b.y + 50;
  const dir = bx > ax ? 1 : -1;
  return `M${ax} ${ay} H${bx - dir * R} A${R} ${R} 0 0 ${dir > 0 ? 1 : 0} ${bx} ${ay + R} V${by}`;
}

let n = 2;
$('sections').innerHTML = SECTIONS.map((s, si) => {
  const here = si === 0;
  const nodes = s.mods.map(([name, cat], i) => {
    n += 1;
    const state = here ? (i === 0 ? 'current' : 'open') : 'later';
    const right = i % 2 === 1;
    return { name, cat, num: n, state, right, x: right ? RX : LX, y: 40 + i * 120 };
  });
  const h = 40 + s.mods.length * 120;
  const wires = '<svg class="wire" width="' + W + '" height="' + h + '">' + nodes.slice(0, -1).map((a, i) => {
    const b = nodes[i + 1];
    const solid = here && i === 0;
    return `<path d="${routePath(a, b)}" fill="none" stroke="${here ? '#5C8F2A' : '#2A2F27'}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" ${solid ? '' : 'stroke-dasharray="1 8"'}/>`;
  }).join('') + '</svg>';
  const tiles = nodes.map((d) => `
    <a class="node ${d.state}" href="module.html" style="left:${d.x}px;top:${d.y}px" aria-label="Module ${d.num}: ${d.name}">
      ${d.state === 'current' ? '<span class="here-pill">You start here</span>' : ''}
      ${tile(d.state, d.num)}
    </a>
    <div class="node-label ${d.state === 'later' ? 'later' : ''}" style="left:${d.right ? d.x + 134 : d.x - 184}px;top:${d.y + 24}px;width:170px;text-align:${d.right ? 'left' : 'right'}">
      <b>${d.name}</b><span>${d.cat}</span>
    </div>`).join('');
  return `
    <div class="section ${here ? 'here' : ''}" id="${s.id}">
      <div class="section-head"><div>
        <div class="kicker">Section ${si + 2}${here ? ' · You are here' : ''}</div>
        <h2>${s.title}</h2>
        <p>${s.why}</p>
      </div></div>
      <div class="map" style="width:${W}px;height:${h}px">${wires}${tiles}</div>
    </div>`;
}).join('');

$('doneTile').innerHTML = tile('done', '✓', 36, 30, 6);
$('legend').innerHTML = [['current', 'Up next'], ['open', 'In this section'], ['later', 'Later']]
  .map(([s, l]) => `<div>${tile(s, undefined, 26, 22, 4)}${l}</div>`).join('');

// Corner dock: grows on hover, click pins it.
const dock = $('infoDock');
let pinned = false, t;
const set = (o) => { dock.classList.toggle('open', o); dock.setAttribute('aria-expanded', o); };
dock.addEventListener('mouseenter', () => { clearTimeout(t); t = setTimeout(() => set(true), 140); });
dock.addEventListener('mouseleave', () => { clearTimeout(t); if (!pinned) t = setTimeout(() => set(false), 260); });
dock.addEventListener('click', () => { pinned = !pinned; set(pinned); });
document.addEventListener('click', (e) => { if (!dock.contains(e.target)) { pinned = false; set(false); } });
dock.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pinned = !pinned; set(pinned); } });
</script>
</body>
</html>
