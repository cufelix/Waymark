<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your roadmap</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<header id="top" data-step="4"></header>

<main class="wrap" style="max-width: 900px; flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 40px">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="roadmapContext" style="font-size:13px;color:var(--muted)">Building your sourced roadmap…</span>
      <h1 id="occupation" style="font:700 44px/1.05 var(--display)">Your roadmap</h1>
    </div>
    <a class="ghost" href="paths.html">Change path</a>
  </div>

  <div id="target"></div>

  <div id="sections" style="display: flex; flex-direction: column; gap: 40px"></div>
</main>

<!-- Useful extras, tucked into the corner -->
<div class="info-dock" id="infoDock" tabindex="0" role="button" aria-expanded="false" aria-label="Progress and legend">
  <div class="id-mini">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span id="dockNext">Next up</span>
  </div>
  <div class="id-body">
    <div>
      <div style="font:600 15px var(--display)">Your roadmap</div>
      <div id="dockText" style="font-size:13px;color:var(--muted);margin-top:4px">The next useful chapter is highlighted.</div>
    </div>

    <div class="legend" id="legend" style="border-top: none; padding-top: 0"></div>
  </div>
</div>

<script src="sample.js"></script>
<script src="live.js"></script>
<script src="roadmap-live.js"></script>
</body>
</html>
