<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module: Variables and logic</title>
<link rel="stylesheet" href="styles.css">
<style>
.goal { position: relative; overflow: hidden; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(circle at 85% 0%, rgba(184, 242, 91, .18), transparent 55%), linear-gradient(180deg, #1A2214, #131811); border: 1px solid var(--accent-line); }
.goal-text { font: 700 32px/1.2 var(--display); max-width: 760px; }
.goal-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.why-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
</style>
<script src="app.js"></script>
</head>
<body>
<header id="top" data-step="4"></header>

<main class="wrap" style="max-width: 1160px; flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 32px; padding-top: 36px; padding-bottom: 64px">
  <a class="back" href="roadmap.html"><span data-icon="back"></span>Back to roadmap</a>

  <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
    <span id="heroTile" style="filter: drop-shadow(0 0 18px rgba(184,242,91,.5)); animation: pop .4s ease-out both"></span>
    <div style="flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 6px">
      <span id="moduleMeta" style="font-size:13px;color:var(--muted)">Roadmap chapter</span>
      <h1 id="chapterTitle" style="font:700 44px/1.05 var(--display)">Loading chapter…</h1>
    </div>
  </div>

  <div class="goal">
    <span class="lbl" style="color: var(--accent)">After this you can</span>
    <div class="goal-text" id="outcome"></div>
    <div class="goal-meta">
      <span class="chip" id="skillsMeta" style="font-size:13px;padding:5px 12px"></span><span id="effortMeta" style="font-size:14px;color:var(--muted)"></span>
    </div>
  </div>

  <div class="why-row" id="whyRow"></div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <span class="lbl">Start here</span>
    <div id="topResource"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
      <span class="lbl">More good options</span>
      <div class="seg-group" role="group" aria-label="Filter by price" id="filters"></div>
    </div>
    <div id="list" style="display: flex; flex-direction: column; gap: 14px"></div>
  </div>

  <div style="border-top: 1px solid var(--line); padding-top: 28px">
    <div id="todo" style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <button class="cta" type="button" id="markDone" style="padding: 0 26px 0 22px; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Mark as done</button>
      <span style="font-size: 14px; color: var(--muted)">Next up: Functions</span>
    </div>
    <div class="unlocked" id="unlocked" hidden>
      <span id="nextTile" style="filter: drop-shadow(0 0 14px rgba(184,242,91,.5))"></span>
      <div style="flex: 1; min-width: 220px">
        <div style="font: 700 22px var(--display)">Unlocked: Functions</div>
        <div style="font-size: 14px; color: var(--muted)">Your next chapter is ready.</div>
      </div>
      <a class="cta" href="roadmap.html">Back to roadmap</a>
    </div>
  </div>
</main>

<script src="sample.js"></script>
<script src="live.js"></script>
<script src="module-live.js"></script>
</body>
</html>
