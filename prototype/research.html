<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<header id="top" data-step="3"></header>

<main class="wrap" style="max-width: 1100px; gap: 48px; padding-top: 56px">
  <section class="col-main" style="flex-basis: 520px; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 class="h1" id="headline">Researching the job market for you…</h1>
      <p class="lead">We're reading real job ads and company pages in Prague to see what employers actually ask for right now.</p>
    </div>
    <ol class="feed" id="feed"></ol>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <a class="cta" href="paths.html" id="next" hidden>See my top 3 paths <span data-icon="arrow"></span></a>
      <button class="ghost" type="button" id="replay">Replay</button>
    </div>
  </section>

  <aside class="col-side" style="flex-basis: 320px; display: flex; flex-direction: column; gap: 18px">
    <div class="panel">
      <div class="panel-title">Companies found</div>
      <div class="logos" id="logos"></div>
      <div style="font-size: 13px; color: var(--faint)">Logo placeholders. Real company logos come from the scrape.</div>
    </div>
    <div class="panel" style="gap: 8px">
      <div class="lbl">Now reading</div>
      <div id="reading" style="font-size: 15px; line-height: 1.5; color: var(--text-soft)"></div>
    </div>
  </aside>
</main>

<script src="live.js"></script>
<script>
// Live: polls the research run in Part 2 and shows each step's real progress and the companies found.
const $ = (id) => document.getElementById(id);
const STEPS = [
  { key: 'vacancies', label: 'Reading job ads', unit: 'searches' },
  { key: 'career-paths', label: 'Picking your top career paths', unit: '' },
  { key: 'market', label: 'Checking what employers ask for', unit: 'ads' },
  { key: 'companies', label: 'Checking the companies hiring', unit: 'companies' },
  { key: 'seeker-research', label: 'Reading your links', unit: 'steps' },
];
const DONE_IC = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#B8F25B"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#0D0F0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SPIN_IC = '<svg class="spin" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#2A2F27" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="#B8F25B" stroke-width="3" stroke-linecap="round"/></svg>';
const WAIT_IC = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#2A2F27" stroke-width="2"/></svg>';
const runId = Live.store.get('runId');
$('feed').innerHTML = STEPS.map((s) => '<li><span class="ico"></span><span class="label">' + s.label + '</span><span class="count"></span></li>').join('');
const rows = [...$('feed').children];
$('replay').hidden = true;
let shown = new Set();

async function poll() {
  if (!runId) { $('headline').textContent = 'No research running. Start from the interview.'; return; }
  let run;
  try { run = await Live.api('GET', '/v1/research-runs/' + runId); } catch (e) { $('reading').textContent = e.message; return setTimeout(poll, 4000); }
  const by = Object.fromEntries((run.progress || []).map((p) => [p.step, p]));
  rows.forEach((li, i) => {
    const s = STEPS[i], p = by[s.key];
    const done = run.status === 'done' || (p && p.total > 0 && p.done >= p.total);
    const active = !done && !!p;
    li.className = done ? 'done' : active ? 'active' : '';
    li.querySelector('.ico').innerHTML = done ? DONE_IC : active ? SPIN_IC : WAIT_IC;
    li.querySelector('.count').textContent = p && s.unit && p.total ? p.done + ' / ' + p.total + ' ' + s.unit : '';
  });
  const paths = await Live.api('GET', '/v1/research-runs/' + runId + '/career-paths').catch(() => null);
  if (paths) $('next').hidden = false;
  if (run.status === 'done') {
    const page = await Live.api('GET', '/v1/research-runs/' + runId + '/companies?pageSize=12').catch(() => []);
    page.forEach((c) => { if (!shown.has(c.id)) { shown.add(c.id); const d = document.createElement('div'); d.title = c.name; d.textContent = c.name.slice(0, 1).toUpperCase(); $('logos').appendChild(d); } });
    const cost = (run.cost || []).reduce((n, c) => n + c.usd, 0);
    $('headline').textContent = 'Done. Here is what the market says.';
    $('reading').textContent = (run.result ? run.result.vacancyIds.length + ' job ads, ' + run.result.companyIds.length + ' companies' : '') + ' · research cost $' + cost.toFixed(2);
    return;
  }
  if (run.status === 'failed') { $('headline').textContent = 'The research failed: ' + ((run.error && run.error.message) || 'unknown error'); return; }
  $('headline').textContent = paths ? 'Your top paths are ready. Still checking the details…' : 'Researching the job market for you…';
  $('reading').textContent = 'Status: ' + run.status;
  setTimeout(poll, 3000);
}
document.querySelectorAll('[data-icon]').forEach((el) => el.innerHTML = ICON[el.dataset.icon]);
poll();
</script>
</body>
</html>
