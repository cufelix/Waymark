<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<header id="top" data-step="1"></header>

<main class="wrap" style="max-width: 1200px">
  <section class="col-main">
    <div>
      <div id="qnum" style="font-size: 13px; color: var(--muted); margin-bottom: 10px">Question 1 of 5</div>
      <div class="progress"><div id="bar"></div></div>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="typing" id="typing" hidden><span></span><span></span><span></span></div>
    <div class="bubbles" id="bubbles"></div>
    <form class="own" id="own">
      <label for="ownInput" class="sr-only">Type your own answer</label>
      <input id="ownInput" class="field" type="text" placeholder="Or type your own answer…" autocomplete="off">
      <button class="cta" type="submit" style="min-height: 44px; padding: 0 20px">Send</button>
    </form>
    <div id="finish" hidden style="padding-left: 48px; display: flex; flex-wrap: wrap; gap: 12px">
      <a class="cta" href="upload.html">Continue <span id="arrow"></span></a>
      <button class="ghost" type="button" id="restart">Start over</button>
    </div>
  </section>

  <aside class="col-side panel">
    <div>
      <div class="panel-title">What I know about you</div>
      <p class="hint">Builds as you answer. This is what the research runs on.</p>
    </div>
    <div class="facts" id="facts"></div>
  </aside>
</main>

<script src="live.js"></script>
<script>
// Live interview: Part 1 asks, the seeker answers; the side panel shows what Part 1 has understood so far.
const $ = (id) => document.getElementById(id);
let busy = false, done = false, prefs = {};
function agentSay(text) {
  const d = document.createElement('div');
  d.className = 'msg-agent';
  d.innerHTML = '<div class="avatar">' + LOGO.replace('width="28" height="28"', 'width="18" height="18"') + '</div><p>' + esc(text).replace(/\n/g, '<br>') + '</p>';
  $('chat').appendChild(d);
}
function meSay(text) {
  const d = document.createElement('div');
  d.className = 'msg-me';
  d.textContent = text;
  $('chat').appendChild(d);
}
const FACTS = [
  ['Role', (p) => (p.targetOccupations || []).map((o) => o.label).join(', ')],
  ['Where', (p) => (p.locations || []).map((l) => [l.city, l.country].filter(Boolean).join(', ')).join('; ') + (p.remote ? ' · remote: ' + p.remote : '')],
  ['Right now', (p) => ({ 'learn-fast': 'Learn fast and grow', stability: 'A stable job and salary', mission: 'Work that means something' })[p.goal] || ''],
  ['Dream employers', (p) => (p.dreamCompanies || []).map((c) => c.name).join(', ')],
  ['Languages', (p) => (p.languages || []).map((l) => l.lang + ' (' + l.level + ')').join(', ')],
  ['Won\'t do', (p) => (p.dealBreakers || []).join(', ')],
];
function renderFacts() {
  const filled = FACTS.map(([, f]) => f(prefs)).filter(Boolean).length;
  $('facts').innerHTML = FACTS.map(([label, f]) => {
    const v = f(prefs);
    return '<div class="fact"><span class="lbl">' + label + '</span>' + (v ? '<span class="chip">' + esc(v) + '</span>' : '<span class="chip-empty">Not yet</span>') + '</div>';
  }).join('');
  $('bar').style.width = (done ? 100 : filled / FACTS.length * 100) + '%';
  $('qnum').textContent = done ? 'Interview complete' : 'Interview in progress';
}
function render() {
  $('own').hidden = done || busy;
  $('finish').hidden = !done;
  $('bubbles').innerHTML = '';
  $('typing').hidden = !busy;
  renderFacts();
}
async function turn(text) {
  if (busy) return;
  if (text) meSay(text);
  busy = true; render();
  try {
    const id = await Live.seeker();
    const r = await Live.api('POST', '/v1/seekers/' + id + '/interview/messages', { text: text || '' });
    prefs = r.preferences || prefs;
    agentSay(r.reply);
    // Continue as soon as the profile has what research needs, even if the interviewer still has questions.
    const p = await Live.api('GET', '/v1/seekers/' + id + '/profile');
    done = !!r.done || p.status === 'complete';
  } catch (e) {
    Live.banner('Could not reach the interviewer: ' + e.message, 'error');
  }
  busy = false; render();
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}
async function start() {
  $('chat').innerHTML = ''; done = false; prefs = {};
  try {
    const id = await Live.seeker();
    const history = await Live.api('GET', '/v1/seekers/' + id + '/interview').catch(() => []);
    if (history.length) {
      history.forEach((t) => (t.role === 'agent' ? agentSay(t.text) : meSay(t.text)));
      const p = await Live.api('GET', '/v1/seekers/' + id + '/profile');
      prefs = p.preferences || {};
      render();
      return;
    }
  } catch (e) {}
  turn('');
}
$('own').addEventListener('submit', (e) => { e.preventDefault(); const v = $('ownInput').value.trim(); $('ownInput').value = ''; if (v) turn(v); });
$('restart').onclick = () => { Live.reset(); start(); };
$('arrow').innerHTML = ICON.arrow;
// Lets the seeker move on once the interview has the essentials, even if the agent still has questions.
$('finish').hidden = true;
render();
start();
</script>
</body>
</html>
